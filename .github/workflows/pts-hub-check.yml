name: PTS Hub Checks

on:
  push:
    paths:
      - "tools/group_b_hub_data.py"
      - "tools/autopts_guide_data.py"
      - "tools/build_pts_report_bundle.py"
      - "tools/check_group_b_hub.py"
      - "tools/templates/pts_report_he/**"
      - "tools/data/group_b_*.json"
      - "dashboards/pts_report_he/**"
      - ".github/data/profiles-db.yaml"
      - ".github/data/profile-patterns.md"
      - ".github/data/sources-map.yaml"
      - ".github/docs/system-journal.md"
      - ".github/workflows/pts-hub-check.yml"
  pull_request:
    paths:
      - "tools/group_b_hub_data.py"
      - "tools/autopts_guide_data.py"
      - "tools/build_pts_report_bundle.py"
      - "tools/check_group_b_hub.py"
      - "tools/templates/pts_report_he/**"
      - "tools/data/group_b_*.json"
      - "dashboards/pts_report_he/**"
      - ".github/data/profiles-db.yaml"
      - ".github/data/profile-patterns.md"
      - ".github/data/sources-map.yaml"
      - ".github/docs/system-journal.md"
      - ".github/workflows/pts-hub-check.yml"
  workflow_dispatch:

jobs:
  validate-pts-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Python syntax checks
        run: |
          python -m py_compile tools/group_b_hub_data.py tools/autopts_guide_data.py tools/build_pts_report_bundle.py

      - name: JS syntax checks
        run: |
          node --check tools/templates/pts_report_he/autopts/report.js
          node --check tools/templates/pts_report_he/report.js

      - name: Detect local-only data availability
        id: local_data
        run: |
          if [ -d data/raw/bluetooth_sig/profiles ] && [ -f data/curated/group_b/profiles/BPS/logic.md ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped local-data validation
        if: steps.local_data.outputs.available != 'true'
        run: |
          echo "Local-only data/ tree is not available in this checkout."
          echo "Skipping Group B content validation and bundle generation."

      - name: Group B Hub schema/content checks
        if: steps.local_data.outputs.available == 'true'
        run: |
          python tools/check_group_b_hub.py

      - name: Build dashboard + hub bundles
        if: steps.local_data.outputs.available == 'true'
        run: |
          python tools/build_pts_report_bundle.py

      - name: Verify generated bundle snapshots remain valid
        if: steps.local_data.outputs.available == 'true'
        run: |
          python tools/check_group_b_hub.py --allow-threshold-fail
